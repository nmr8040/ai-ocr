services:
  - type: web
    name: ai-ocr
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /
    envVars:
      - key: OCR_ENGINE
        value: tesseract
      - key: AI_PROVIDER
        value: auto
      - key: TESSERACT_LANG
        value: jpn+eng
      - key: OPENAI_API_KEY
        sync: false
